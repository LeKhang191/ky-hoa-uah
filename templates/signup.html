<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - UAH Ký Họa</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2>ĐĂNG KÝ THÀNH VIÊN</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <input type="text" name="fullname" placeholder="Họ và tên hiển thị" required class="auth-input">
            </div>

            <div class="form-group">
                <input type="text" name="username" placeholder="Tên đăng nhập" required class="auth-input">
            </div>

            <div class="form-group">
                <input type="password" name="password" placeholder="Mật khẩu" required class="auth-input">
            </div>

            <button type="submit" class="btn-auth">ĐĂNG KÝ NGAY</button>
        </form>
        
        <div class="auth-footer">
            <p>Đã có tài khoản? <a href="/login">Đăng nhập ngay</a></p>
            <p><a href="/">&larr; Về trang chủ</a></p>
        </div>
    </div>
</body>
</html>
